services:
  mariadb:
    image: mariadb:11.2
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  auth-service:
    image: ${ACR_LOGIN_SERVER}/auth-service:latest
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
    networks:
      - backend
    depends_on:
      mariadb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  api-gateway:
    image: ${ACR_LOGIN_SERVER}/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - frontend
      - backend
    depends_on:
      - auth-service
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M

  presenca-db:
    image: postgres:17
    container_name: presenca-db
    environment:
      POSTGRES_DB: ${PRESENCA_DB_NAME}
      POSTGRES_USER: ${PRESENCA_DB_USER}
      POSTGRES_PASSWORD: ${PRESENCA_DB_PASSWORD}
    volumes:
      - presenca-db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PRESENCA_DB_USER}", "-d", "${PRESENCA_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  presenca-service:
    image: ${ACR_LOGIN_SERVER}/presenca-service:latest
    container_name: presenca-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://presenca-db:5432/${PRESENCA_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${PRESENCA_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PRESENCA_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      - backend
    depends_on:
      presenca-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  register-adm-service:
    image: ${ACR_LOGIN_SERVER}/register-adm-service:latest
    container_name: register-adm-service
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      - backend
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  relatorio-db:
    image: mariadb:11.2
    container_name: relatorio-db
    environment:
      MYSQL_ROOT_PASSWORD: ${RELATORIO_DB_PASSWORD}
      MYSQL_DATABASE: ${RELATORIO_DB_NAME}
      MYSQL_USER: ${RELATORIO_DB_USER}
      MYSQL_PASSWORD: ${RELATORIO_DB_PASSWORD}
    volumes:
      - relatorio-db-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  relatorio-service:
    image: ${ACR_LOGIN_SERVER}/relatorio-service:latest
    container_name: relatorio-service
    environment:
      ConnectionStrings__RelatoriosDb: Server=relatorio-db;Port=3306;Database=${RELATORIO_DB_NAME};User Id=${RELATORIO_DB_USER};Password=${RELATORIO_DB_PASSWORD};SslMode=None
      ConnectionStrings__Redis: redis:6379
      PresencaService__BaseUrl: http://presenca-service:8082
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USERNAME}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    networks:
      - backend
    depends_on:
      relatorio-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  route-gen-db:
    image: postgres:17
    container_name: route-gen-db
    environment:
      POSTGRES_DB: ${ROUTE_GEN_DB_NAME}
      POSTGRES_USER: ${ROUTE_GEN_DB_USER}
      POSTGRES_PASSWORD: ${ROUTE_GEN_DB_PASSWORD}
    volumes:
      - route-gen-db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${ROUTE_GEN_DB_USER}", "-d", "${ROUTE_GEN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  route-generator:
    image: ${ACR_LOGIN_SERVER}/route-generator:latest
    container_name: route-generator
    environment:
      ConnectionStrings__DefaultConnection: Host=route-gen-db;Port=5432;Database=${ROUTE_GEN_DB_NAME};Username=${ROUTE_GEN_DB_USER};Password=${ROUTE_GEN_DB_PASSWORD}
    networks:
      - backend
    depends_on:
      route-gen-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  mariadb-data:
  rabbitmq-data:
  presenca-db-data:
  relatorio-db-data:
  route-gen-db-data:
